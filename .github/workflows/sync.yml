name: Sync data from arusgrid.com
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live files
        run: |
          set -e
          for f in data.json colo.json policy.json; do
            curl -fsSL -A 'arusgrid-data sync' "https://arusgrid.com/$f" -o "$f.new"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f.new"
            mv "$f.new" "$f"
          done
      - name: Commit when changed
        run: |
          git config user.name 'arusgrid-sync'
          git config user.email 'hello@arusgrid.com'
          git add data.json colo.json policy.json
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "data $(date -u +%Y-%m-%d)"
          git push
